name: Jest
on: push
jobs:
    test:
        runs-on: ubuntu-26.04
        strategy:
            matrix:
                # lowest and highest supported major version of peer dependency graphql
                graphql: ["16", "17"]
        steps:
            - uses: actions/checkout@v6
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm ci

            - name: Install graphql ${{ matrix.graphql }}
              if: matrix.graphql != '16'
              run: npm pkg set devDependencies.graphql=^${{ matrix.graphql }}.0.0 && npm install --ignore-scripts

            - name: Run tests
              run: npm test
