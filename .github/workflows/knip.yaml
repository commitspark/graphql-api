name: Lint dependencies with knip

on: push

jobs:
  knip:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run knip
        run: npm run knip
