name: Lint
on: push
jobs:
    lint:
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v6
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint
